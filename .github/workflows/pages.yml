name: Publish dashboard

# Builds data.generated.js and publishes the site to GitHub Pages.
#
# Triggered by pushes to results/, NOT on a schedule. The push from test-infra
# is the exact completion signal; a cron would be a guess. GitHub's scheduler
# drifts badly in practice — the E2E workflows are scheduled at 07:00/07:15 UTC
# but observed starting anywhere from 07:10 to 07:48, and a job can run for up
# to its 60-minute timeout — so any fixed publish time would either fire before
# the data landed or leave the site stale.
#
# Because test-infra pushes daily, a failed deploy self-heals on the next
# push. The case neither trigger covers is test-infra silently stopping; the
# freshness indicator on the page surfaces that instead.
#
# data.generated.js is deliberately NOT committed: it is rebuilt from results/
# on every push, so committing it would add a rewritten copy of the entire
# dataset to git history on every single run. Pages artifacts live outside git
# history, which avoids that entirely — and removes the need for the
# bot-commit loop guard that a self-committing workflow would require.

on:
  push:
    branches: [main]
    paths:
      - "results/**"
      - "scenarios/**"
      - "index.html"
      - "generate-results.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight publish finish, then run the newest one. Never cancel a
# push that has already been accepted, or a run's data would silently miss
# the published site until the next push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate before publishing
        run: python3 validate-results.py

      - name: Build data.generated.js
        run: python3 generate-results.py -o site/data.generated.js

      - name: Assemble site
        run: cp index.html site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
